<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bridge receiver demo</title><style>body{font:16px system-ui;padding:32px;max-width:640px;margin:auto;color:#245544}button{padding:14px;border:0;border-radius:12px;background:#245544;color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf0e6;padding:20px;border-radius:12px}</style><h1>Bridge receiver</h1><p>Halaman pengujian SDK, bukan frontend PPOB. Token hanya disimpan sementara di memory dan tidak ditampilkan.</p><button id="request">Minta token baru</button><pre id="status" role="status"></pre><script type="module">import{createMerchantBridge}from'/merchant-bridge.js';const bridge=createMerchantBridge({merchantOrigin:location.origin});async function run(){try{const result=await bridge.getAccessToken();document.getElementById('status').textContent=JSON.stringify({status:'BRIDGE_OK',token_type:result.token_type,expires_in:result.expires_in,merchant_code:result.merchant_code},null,2);}catch(e){document.getElementById('status').textContent=e.message;}}document.getElementById('request').onclick=run;run();</script></html>
